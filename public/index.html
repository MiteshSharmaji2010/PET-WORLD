<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#081018"
    >

    <title>PET WORLD</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <!-- =================================================
         GAME LOADING
    ================================================== -->

    <div id="loading-screen">

        <div class="loading-box">

            <div class="loading-logo">
                🐾
            </div>

            <h1>
                PET WORLD
            </h1>

            <p>
                Loading your world...
            </p>

            <div class="loading-bar">

                <div
                    id="loading-progress"
                ></div>

            </div>

            <span id="loading-status">
                Starting...
            </span>

        </div>

    </div>


    <!-- =================================================
         GAME ERROR
    ================================================== -->

    <div
        id="game-error"
        class="hidden"
    >

        <div class="error-box">

            <h2>
                ⚠️ GAME ERROR
            </h2>

            <p id="game-error-message">
                Game failed to start.
            </p>

            <button
                onclick="location.reload()"
            >
                RELOAD GAME
            </button>

        </div>

    </div>


    <!-- =================================================
         GAME UI ROOT
    ================================================== -->

    <div id="game-ui">

        <!-- TOP BAR -->

        <div class="top-bar">

            <div class="game-title">
                🐾 PET WORLD
            </div>

            <div
                id="connection-status"
                class="connection-status offline"
            >
                OFFLINE
            </div>

        </div>


        <!-- PLAYER STATS -->

        <div class="player-stats">

            <div class="stat-box">

                <span>
                    ❤️
                </span>

                <div class="stat-bar">

                    <div
                        id="health-fill"
                        class="health-fill"
                    ></div>

                </div>

                <strong id="health-value">
                    100
                </strong>

            </div>


            <div class="stat-box">

                <span>
                    🍖
                </span>

                <div class="stat-bar">

                    <div
                        id="hunger-fill"
                        class="hunger-fill"
                    ></div>

                </div>

                <strong id="hunger-value">
                    100
                </strong>

            </div>


            <div class="stat-box">

                <span>
                    ⚡
                </span>

                <div class="stat-bar">

                    <div
                        id="stamina-fill"
                        class="stamina-fill"
                    ></div>

                </div>

                <strong id="stamina-value">
                    100
                </strong>

            </div>

        </div>


        <!-- CROSSHAIR -->

        <div
            id="crosshair"
            class="crosshair"
        >
            +
        </div>


        <!-- HELP -->

        <div class="controls-help">

            <span>
                W A S D
            </span>

            Move

            <span>
                SHIFT
            </span>

            Run

            <span>
                SPACE
            </span>

            Jump

            <span>
                E
            </span>

            Capture

            <span>
                F
            </span>

            Eat

        </div>


        <!-- NOTIFICATIONS -->

        <div
            id="ui-notifications"
        ></div>


        <!-- MULTIPLAYER PLAYER COUNT -->

        <div
            id="online-count"
            class="online-count"
        >
            🟢 1 Player
        </div>

    </div>


    <!-- SOCKET.IO -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!-- GAME -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
