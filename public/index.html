<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#111820"
    >

    <title>PET WORLD</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>

    <!-- ==========================================
         LOADING SCREEN
         ========================================== -->

    <div id="loading-screen">

        <div class="loading-box">

            <div class="game-logo">
                PET WORLD
            </div>

            <div class="loading-subtitle">
                OPEN WORLD • PET CAPTURE • SURVIVAL
            </div>

            <div class="loading-bar">

                <div
                    id="loading-progress"
                ></div>

            </div>

            <div id="loading-text">
                Loading world...
            </div>

        </div>

    </div>


    <!-- ==========================================
         GAME
         ========================================== -->

    <script type="module">

        import { Game }
        from "./js/game.js";


        const loadingScreen =
            document.getElementById(
                "loading-screen"
            );


        const loadingProgress =
            document.getElementById(
                "loading-progress"
            );


        const loadingText =
            document.getElementById(
                "loading-text"
            );


        function setLoading(
            progress,
            text
        ) {

            loadingProgress.style.width =
                `${progress}%`;

            loadingText.textContent =
                text;

        }


        async function startGame() {

            try {

                setLoading(
                    10,
                    "Preparing engine..."
                );


                await wait(300);


                setLoading(
                    25,
                    "Creating world..."
                );


                await wait(300);


                setLoading(
                    45,
                    "Loading player..."
                );


                await wait(300);


                setLoading(
                    65,
                    "Finding wild pets..."
                );


                await wait(300);


                setLoading(
                    80,
                    "Preparing controls..."
                );


                await wait(300);


                const game =
                    new Game();


                window.petWorldGame =
                    game;


                setLoading(
                    90,
                    "Starting game..."
                );


                await game.init();


                setLoading(
                    100,
                    "Ready!"
                );


                await wait(500);


                loadingScreen.classList.add(
                    "hidden"
                );


                setTimeout(
                    () => {

                        loadingScreen.remove();

                    },
                    700
                );


            } catch (
                error
            ) {

                console.error(
                    "PET WORLD ERROR:",
                    error
                );


                loadingText.textContent =
                    "Game failed to start. Check Console.";

                loadingText.style.color =
                    "#ff6b6b";

            }

        }


        function wait(
            milliseconds
        ) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );

        }


        startGame();

    </script>


    <!-- ==========================================
         LOADING SCREEN STYLE
         ========================================== -->

    <style>

        #loading-screen {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #25343b 0%,
                    #10181d 45%,
                    #050709 100%
                );

            color: white;

            opacity: 1;

            transition:
                opacity 0.7s ease;

        }


        #loading-screen.hidden {

            opacity: 0;

            pointer-events: none;

        }


        .loading-box {

            width:
                min(430px, 88vw);

            padding: 30px;

            text-align: center;

        }


        .game-logo {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size:
                clamp(
                    34px,
                    9vw,
                    62px
                );

            font-weight: 900;

            letter-spacing: 5px;

            text-shadow:
                0 4px 25px
                rgba(0, 0, 0, 0.6);

        }


        .loading-subtitle {

            margin-top: 10px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            font-size: 11px;

            letter-spacing: 2px;

        }


        .loading-bar {

            width: 100%;

            height: 7px;

            margin-top: 30px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

        }


        #loading-progress {

            width: 0%;

            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #52d273,
                    #a6ffb5
                );

            transition:
                width 0.3s ease;

        }


        #loading-text {

            margin-top: 13px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.75
                );

            font-size: 13px;

        }


        @media (
            max-width: 600px
        ) {

            .loading-box {

                padding: 20px;

            }


            .game-logo {

                letter-spacing: 3px;

            }


            .loading-subtitle {

                font-size: 8px;

            }

        }

    </style>

</body>

</html>
