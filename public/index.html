<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#101820"
    >

    <title>PET WORLD</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <!-- ========================================= -->
    <!-- LOADING SCREEN -->
    <!-- ========================================= -->

    <div id="loading-screen">

        <div class="loading-content">

            <div class="loading-logo">
                🐾
            </div>

            <h1>
                PET WORLD
            </h1>

            <p>
                Explore • Survive • Capture • Grow
            </p>

            <div class="loading-bar">

                <div
                    id="loading-progress"
                ></div>

            </div>

            <div id="loading-text">
                Loading world...
            </div>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- GAME HUD -->
    <!-- ========================================= -->

    <div id="game-hud">

        <div
            id="top-left-hud"
            class="hud-panel"
        >

            <div class="player-name">
                PLAYER
            </div>

            <div class="health-container">

                <span>
                    ❤️
                </span>

                <div class="hud-bar">

                    <div
                        id="health-fill"
                        class="health-fill"
                    ></div>

                </div>

                <span id="health-text">
                    100/100
                </span>

            </div>

            <div class="stamina-container">

                <span>
                    ⚡
                </span>

                <div class="hud-bar">

                    <div
                        id="stamina-fill"
                        class="stamina-fill"
                    ></div>

                </div>

            </div>

            <div class="hunger-container">

                <span>
                    🍖
                </span>

                <div class="hud-bar">

                    <div
                        id="hunger-fill"
                        class="hunger-fill"
                    ></div>

                </div>

            </div>

        </div>


        <!-- ===================================== -->
        <!-- CROSSHAIR -->
        <!-- ===================================== -->

        <div id="crosshair">
            +
        </div>


        <!-- ===================================== -->
        <!-- INTERACTION -->
        <!-- ===================================== -->

        <div
            id="interaction-message"
            class="hidden"
        >
            Press E to interact
        </div>


        <!-- ===================================== -->
        <!-- BOTTOM ACTIONS -->
        <!-- ===================================== -->

        <div id="action-buttons">

            <button
                id="inventory-button"
                class="action-button"
            >
                🎒
                <span>
                    Inventory
                </span>
            </button>

            <button
                id="map-button"
                class="action-button"
            >
                🗺️
                <span>
                    Map
                </span>
            </button>

            <button
                id="pets-button"
                class="action-button"
            >
                🐾
                <span>
                    Pets
                </span>
            </button>

            <button
                id="settings-button"
                class="action-button"
            >
                ⚙️
                <span>
                    Settings
                </span>
            </button>

        </div>


        <!-- ===================================== -->
        <!-- COMBAT -->
        <!-- ===================================== -->

        <div id="combat-controls">

            <button
                id="attack-button"
                class="combat-button attack"
            >
                ⚔️
            </button>

            <button
                id="capture-button"
                class="combat-button capture"
            >
                🔵
            </button>

            <button
                id="eat-button"
                class="combat-button eat"
            >
                🍖
            </button>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- GAME CONTAINER -->
    <!-- ========================================= -->

    <main id="game-container"></main>


    <!-- ========================================= -->
    <!-- NOTIFICATIONS -->
    <!-- ========================================= -->

    <div
        id="ui-notifications"
    ></div>


    <!-- ========================================= -->
    <!-- SOCKET.IO -->
    <!-- ========================================= -->

    <script
        src="/socket.io/socket.io.js"
    ></script>


    <!-- ========================================= -->
    <!-- MAIN GAME -->
    <!-- ========================================= -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
