<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#081016"
    >

    <meta
        name="description"
        content="PET WORLD - Open World Pet Capture Adventure"
    >

    <title>PET WORLD</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #071019;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            touch-action: none;

            user-select: none;

            -webkit-user-select: none;

            -webkit-touch-callout: none;

        }


        body {

            position: relative;

        }


        canvas {

            display: block;

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

        }


        /* =========================================
           LOADING SCREEN
        ========================================= */

        #loading-screen {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #172b35 0%,
                    #071019 65%,
                    #03070a 100%
                );

            color: white;

            transition:
                opacity 0.5s ease;

        }


        #loading-screen.hidden {

            opacity: 0;

            pointer-events: none;

        }


        .game-logo {

            font-size: clamp(
                42px,
                10vw,
                90px
            );

            font-weight: 900;

            letter-spacing: 8px;

            text-align: center;

            text-shadow:
                0 0 15px
                rgba(255,255,255,0.25),
                0 8px 30px
                rgba(0,0,0,0.7);

        }


        .game-subtitle {

            margin-top: 10px;

            color: rgba(
                255,
                255,
                255,
                0.65
            );

            font-size: 13px;

            letter-spacing: 4px;

            text-transform: uppercase;

        }


        .loading-container {

            width: min(
                300px,
                75vw
            );

            margin-top: 35px;

        }


        .loading-bar {

            width: 100%;

            height: 7px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

        }


        #loading-progress {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background: #ffffff;

            transition:
                width 0.25s ease;

        }


        #loading-text {

            margin-top: 10px;

            text-align: center;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            font-size: 12px;

        }


        /* =========================================
           START SCREEN
        ========================================= */

        #start-screen {

            position: fixed;

            inset: 0;

            z-index: 9000;

            display: none;

            justify-content: center;

            align-items: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.45
                );

            backdrop-filter:
                blur(3px);

        }


        #start-screen.active {

            display: flex;

        }


        .start-card {

            width: min(
                420px,
                90vw
            );

            padding: 30px;

            border-radius: 22px;

            text-align: center;

            background:
                rgba(
                    8,
                    15,
                    20,
                    0.88
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            box-shadow:
                0 20px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

            color: white;

        }


        .start-card h1 {

            font-size: 34px;

            margin-bottom: 8px;

        }


        .start-card p {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );

            line-height: 1.5;

            font-size: 14px;

            margin-bottom: 22px;

        }


        #start-game {

            width: 100%;

            padding: 14px 20px;

            border: 0;

            border-radius: 14px;

            background: #ffffff;

            color: #101010;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

        }


        #start-game:active {

            transform: scale(0.97);

        }


        /* =========================================
           CROSSHAIR
        ========================================= */

        #crosshair {

            position: fixed;

            left: 50%;
            top: 50%;

            width: 18px;
            height: 18px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 50;

            pointer-events: none;

        }


        #crosshair::before,
        #crosshair::after {

            content: "";

            position: absolute;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

        }


        #crosshair::before {

            width: 18px;

            height: 2px;

            left: 0;

            top: 8px;

        }


        #crosshair::after {

            width: 2px;

            height: 18px;

            left: 8px;

            top: 0;

        }


        /* =========================================
           TOP RIGHT
        ========================================= */

        #game-top-buttons {

            position: fixed;

            top: 15px;

            right: 15px;

            z-index: 120;

            display: flex;

            gap: 8px;

            pointer-events: auto;

        }


        .top-button {

            width: 42px;

            height: 42px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 13px;

            background:
                rgba(
                    8,
                    14,
                    19,
                    0.72
                );

            color: white;

            font-size: 18px;

            cursor: pointer;

            backdrop-filter:
                blur(8px);

        }


        /* =========================================
           ERROR BOX
        ========================================= */

        #game-error {

            position: fixed;

            inset: 20px;

            z-index: 10000;

            display: none;

            padding: 25px;

            overflow: auto;

            border-radius: 18px;

            background:
                #120b0b;

            border:
                1px solid
                rgba(
                    255,
                    80,
                    80,
                    0.35
                );

            color: white;

        }


        #game-error h2 {

            margin-bottom: 12px;

        }


        #game-error pre {

            margin-top: 15px;

            padding: 12px;

            overflow: auto;

            white-space: pre-wrap;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

            border-radius: 10px;

            color:
                #ffb3b3;

            font-size: 12px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (
            max-width: 600px
        ) {

            #crosshair {

                display: none;

            }


            #game-top-buttons {

                top: 8px;

                right: 8px;

            }


            .top-button {

                width: 38px;

                height: 38px;

                font-size: 16px;

            }


            .start-card {

                padding: 24px;

            }


            .start-card h1 {

                font-size: 28px;

            }

        }


        /* =========================================
           LANDSCAPE
        ========================================= */

        @media (
            orientation: landscape
        ) and (
            max-height: 500px
        ) {

            #game-top-buttons {

                top: 7px;

                right: 7px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================= -->

    <div id="loading-screen">

        <div class="game-logo">
            PET WORLD
        </div>

        <div class="game-subtitle">
            Open World Pet Adventure
        </div>

        <div class="loading-container">

            <div class="loading-bar">

                <div
                    id="loading-progress"
                ></div>

            </div>

            <div id="loading-text">
                Loading world...
            </div>

        </div>

    </div>


    <!-- =========================================
         START SCREEN
    ========================================= -->

    <div id="start-screen">

        <div class="start-card">

            <h1>
                PET WORLD
            </h1>

            <p>
                Explore a huge open world,
                discover wild creatures,
                capture them and build your
                own powerful pet team.
            </p>

            <button
                id="start-game"
                type="button"
            >
                ENTER WORLD
            </button>

        </div>

    </div>


    <!-- =========================================
         TOP BUTTONS
    ========================================= -->

    <div id="game-top-buttons">

        <button
            class="top-button"
            id="inventory-button"
            type="button"
            aria-label="Inventory"
        >
            🎒
        </button>

        <button
            class="top-button"
            id="map-button"
            type="button"
            aria-label="Map"
        >
            🗺️
        </button>

        <button
            class="top-button"
            id="settings-button"
            type="button"
            aria-label="Settings"
        >
            ⚙️
        </button>

    </div>


    <!-- =========================================
         CROSSHAIR
    ========================================= -->

    <div id="crosshair"></div>


    <!-- =========================================
         GAME ERROR
    ========================================= -->

    <div id="game-error">

        <h2>
            PET WORLD ERROR
        </h2>

        <p>
            Game start nahi ho saka.
        </p>

        <pre id="game-error-message"></pre>

    </div>


    <!-- =========================================
         MAIN GAME
    ========================================= -->

    <script>

        window.PET_WORLD_CONFIG = {

            gameName:
                "PET WORLD",

            version:
                "1.0.0",

            mobile:
                true,

            shadows:
                true,

            maxPixelRatio:
                1.5

        };


        // Loading progress

        window.setLoadingProgress =
            function (
                percent,
                text
            ) {

                const progress =
                    document.getElementById(
                        "loading-progress"
                    );


                const loadingText =
                    document.getElementById(
                        "loading-text"
                    );


                if (
                    progress
                ) {

                    progress.style.width =
                        `${Math.max(
                            0,
                            Math.min(
                                100,
                                percent
                            )
                        )}%`;

                }


                if (
                    loadingText &&
                    text
                ) {

                    loadingText.textContent =
                        text;

                }

            };


        // Global error handler

        window.addEventListener(
            "error",
            function (
                event
            ) {

                console.error(
                    event.error ||
                    event.message
                );

            }
        );


        window.addEventListener(
            "unhandledrejection",
            function (
                event
            ) {

                console.error(
                    event.reason
                );

            }
        );

    </script>


    <!-- IMPORTANT:
         main.js must be inside public/js/
    -->

    <script
        type="module"
        src="./js/main.js"
    ></script>


    <!-- =========================================
         BASIC UI EVENTS
    ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                window.setLoadingProgress(
                    15,
                    "Starting game..."
                );


                const startButton =
                    document.getElementById(
                        "start-game"
                    );


                if (
                    startButton
                ) {

                    startButton.addEventListener(
                        "click",
                        function () {

                            const startScreen =
                                document.getElementById(
                                    "start-screen"
                                );


                            if (
                                startScreen
                            ) {

                                startScreen.classList
                                    .remove(
                                        "active"
                                    );

                            }


                            if (
                                window.petWorldGame &&
                                typeof
                                window.petWorldGame
                                    .resume ===
                                "function"
                            ) {

                                window.petWorldGame
                                    .resume();

                            }

                        }
                    );

                }


                window.setLoadingProgress(
                    100,
                    "World ready!"
                );


                setTimeout(
                    function () {

                        const loading =
                            document.getElementById(
                                "loading-screen"
                            );


                        if (
                            loading
                        ) {

                            loading.classList
                                .add(
                                    "hidden"
                                );

                        }

                    },
                    700
                );

            }
        );

    </script>


</body>

</html>
