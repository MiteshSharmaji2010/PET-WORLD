<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#071014"
    >

    <meta
        name="description"
        content="PET WORLD - 3D Open World Pet Survival Adventure"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>PET WORLD</title>


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >


    <!-- =====================================================
         BASIC PAGE STYLE
         Fallback styling is included so the game does not
         appear completely unstyled if style.css has an error.
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background: #071014;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            touch-action: none;

        }


        body {

            position: relative;

            user-select: none;

        }


        canvas {

            position: fixed;

            inset: 0;

            display: block;

            width: 100%;

            height: 100%;

            outline: none;

        }


        button {

            font-family: inherit;

        }


        .hidden {

            display: none !important;

        }


        /* =================================================
           LOADING SCREEN
        ================================================= */

        #loading-screen {

            position: fixed;

            inset: 0;

            z-index: 100000;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    #172c34 0%,
                    #071014 55%,
                    #020608 100%
                );

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;

        }


        #loading-screen.loading-hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

        }


        .loading-box {

            width:
                min(
                    420px,
                    88vw
                );

            padding: 32px 24px;

            text-align: center;

            border-radius: 24px;

            background:
                rgba(
                    10,
                    20,
                    25,
                    0.92
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            box-shadow:
                0 30px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );

        }


        .loading-logo {

            font-size:
                clamp(
                    38px,
                    9vw,
                    64px
                );

            font-weight: 900;

            letter-spacing: 5px;

            margin-bottom: 8px;

        }


        .loading-subtitle {

            font-size: 13px;

            opacity: 0.65;

            letter-spacing: 2px;

            margin-bottom: 28px;

        }


        .loading-spinner {

            width: 42px;

            height: 42px;

            margin: 0 auto 18px;

            border-radius: 50%;

            border:
                3px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-top-color: white;

            animation:
                loading-spin
                0.8s linear infinite;

        }


        .loading-text {

            font-size: 12px;

            opacity: 0.7;

        }


        @keyframes loading-spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =================================================
           GAME ERROR
        ================================================= */

        #game-error {

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 100001;

            width:
                min(
                    520px,
                    90vw
                );

            padding: 25px;

            border-radius: 18px;

            background:
                rgba(
                    100,
                    0,
                    0,
                    0.96
                );

            border:
                1px solid
                rgba(
                    255,
                    120,
                    120,
                    0.35
                );

            color: white;

            box-shadow:
                0 30px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.7
                );

        }


        #game-error h2 {

            margin:
                0 0 10px;

        }


        #game-error p {

            margin: 6px 0;

            font-size: 13px;

            line-height: 1.5;

        }


        #reload-game {

            margin-top: 15px;

            padding:
                11px 18px;

            border: 0;

            border-radius: 10px;

            background: white;

            color: #111;

            font-weight: 800;

            cursor: pointer;

        }


        /* =================================================
           TOP GAME HUD
        ================================================= */

        #game-hud {

            position: fixed;

            inset: 0;

            z-index: 100;

            pointer-events: none;

        }


        .hud-top-left {

            position: absolute;

            left: 15px;

            top: 15px;

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        .status-box {

            min-width: 180px;

            padding: 9px 12px;

            border-radius: 12px;

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.65
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            backdrop-filter:
                blur(8px);

        }


        .status-row {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            font-size: 10px;

            margin-bottom: 4px;

        }


        .status-row:last-child {

            margin-bottom: 0;

        }


        .status-label {

            opacity: 0.65;

            font-weight: 700;

        }


        .status-value {

            font-weight: 900;

        }


        .status-bar {

            width: 100%;

            height: 5px;

            overflow: hidden;

            border-radius: 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

        }


        .status-fill {

            height: 100%;

            width: 100%;

            transition:
                width 0.15s linear;

        }


        #health-fill {

            background: #e85c5c;

        }


        #stamina-fill {

            background: #e5c95b;

        }


        #hunger-fill {

            background: #d78b52;

        }


        /* =================================================
           COINS
        ================================================= */

        #coin-display {

            position: absolute;

            right: 15px;

            top: 15px;

            padding:
                9px 14px;

            border-radius: 13px;

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.7
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            font-size: 12px;

            font-weight: 900;

            pointer-events: none;

        }


        /* =================================================
           CROSSHAIR
        ================================================= */

        #crosshair {

            position: fixed;

            left: 50%;

            top: 50%;

            width: 18px;

            height: 18px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 110;

            pointer-events: none;

        }


        #crosshair::before,
        #crosshair::after {

            content: "";

            position: absolute;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.85
                );

            box-shadow:
                0 0 5px
                rgba(
                    0,
                    0,
                    0,
                    0.8
                );

        }


        #crosshair::before {

            width: 2px;

            height: 18px;

            left: 8px;

            top: 0;

        }


        #crosshair::after {

            width: 18px;

            height: 2px;

            left: 0;

            top: 8px;

        }


        /* =================================================
           CONTROL HINT
        ================================================= */

        #control-hint {

            position: absolute;

            left: 15px;

            bottom: 15px;

            padding:
                8px 11px;

            border-radius: 10px;

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.6
                );

            color: white;

            font-size: 10px;

            line-height: 1.5;

            opacity: 0.7;

        }


        /* =================================================
           TOP RIGHT MENU
        ================================================= */

        #top-menu {

            position: absolute;

            right: 15px;

            top: 62px;

            display: flex;

            flex-direction: column;

            gap: 7px;

            pointer-events: auto;

        }


        .hud-button {

            width: 42px;

            height: 42px;

            border: 1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 12px;

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.72
                );

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;

        }


        .hud-button:hover {

            transform:
                scale(1.05);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

        }


        .hud-button:active {

            transform:
                scale(0.94);

        }


        /* =================================================
           NOTIFICATION CONTAINER
        ================================================= */

        #ui-notifications {

            position: fixed;

            left: 50%;

            top: 80px;

            transform:
                translateX(-50%);

            z-index: 10000;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 7px;

            width:
                min(
                    90vw,
                    450px
                );

            pointer-events: none;

        }


        .ui-notification {

            padding:
                9px 16px;

            border-radius: 20px;

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.88
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            color: white;

            font-size: 12px;

            box-shadow:
                0 8px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            animation:
                notification-in
                0.2s ease;

        }


        @keyframes notification-in {

            from {

                opacity: 0;

                transform:
                    translateY(
                        -10px
                    );

            }

            to {

                opacity: 1;

                transform:
                    translateY(
                        0
                    );

            }

        }


        /* =================================================
           MOBILE
        ================================================= */

        #mobile-ui {

            position: fixed;

            inset: 0;

            z-index: 130;

            pointer-events: none;

        }


        #mobile-left {

            position: absolute;

            left: 20px;

            bottom: 25px;

            width: 130px;

            height: 130px;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            pointer-events: auto;

        }


        #mobile-stick {

            position: absolute;

            left: 50%;

            top: 50%;

            width: 58px;

            height: 58px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

        }


        #mobile-right {

            position: absolute;

            right: 20px;

            bottom: 25px;

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 10px;

            pointer-events: auto;

        }


        .mobile-action {

            width: 55px;

            height: 55px;

            border-radius: 50%;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            background:
                rgba(
                    5,
                    12,
                    16,
                    0.7
                );

            color: white;

            font-size: 21px;

            cursor: pointer;

        }


        .mobile-action.small {

            width: 45px;

            height: 45px;

            font-size: 17px;

        }


        @media (
            min-width: 769px
        ) {

            #mobile-ui {

                display: none !important;

            }

        }


        @media (
            max-width: 768px
        ) {

            #control-hint {

                display: none;

            }


            .hud-top-left {

                left: 10px;

                top: 10px;

            }


            #coin-display {

                right: 10px;

                top: 10px;

            }


            #top-menu {

                right: 10px;

                top: 58px;

            }


            .status-box {

                min-width: 150px;

            }


            .status-row {

                font-size: 9px;

            }

        }


        @media (
            max-width: 420px
        ) {

            .status-box {

                min-width: 135px;

            }


            #top-menu {

                top: 55px;

            }


            .hud-button {

                width: 38px;

                height: 38px;

                font-size: 16px;

            }

        }


        /* =================================================
           PAUSE OVERLAY
        ================================================= */

        #pause-overlay {

            position: fixed;

            inset: 0;

            z-index: 500;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.58
                );

            backdrop-filter:
                blur(5px);

            pointer-events: auto;

        }


        .pause-box {

            width:
                min(
                    360px,
                    88vw
                );

            padding: 25px;

            border-radius: 20px;

            background:
                rgba(
                    7,
                    14,
                    19,
                    0.95
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            text-align: center;

        }


        .pause-title {

            font-size: 28px;

            font-weight: 900;

            margin-bottom: 20px;

        }


        .pause-button {

            width: 100%;

            padding: 13px;

            margin-top: 8px;

            border: 0;

            border-radius: 11px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.1
                );

            color: white;

            font-weight: 800;

            cursor: pointer;

        }


        /* =================================================
           ACCESSIBILITY
        ================================================= */

        button:focus-visible {

            outline:
                2px solid white;

            outline-offset: 2px;

        }


        /* =================================================
           NO-SCRIPT
        ================================================= */

        #no-script {

            position: fixed;

            inset: 0;

            z-index: 999999;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #071014;

            color: white;

            text-align: center;

            padding: 30px;

        }

    </style>

</head>


<body>


    <!-- =====================================================
         JAVASCRIPT DISABLED
    ====================================================== -->

    <noscript>

        <div id="no-script">

            <div>

                <h2>JavaScript Required</h2>

                <p>
                    PET WORLD requires JavaScript
                    to run the 3D game.
                </p>

                <p>
                    Please enable JavaScript
                    and reload the page.
                </p>

            </div>

        </div>

    </noscript>


    <!-- =====================================================
         NEW UPDATED LOADING SCREEN (For main.js & game.js)
    ====================================================== -->
    <div id="pet-world-loading">
        <div class="pet-loading-box">
            <div class="pet-loading-logo">🐾</div>
            <div class="pet-loading-title">PET WORLD</div>
            <div id="pet-loading-message" class="pet-loading-message">Loading world...</div>
            <div class="pet-loading-progress">
                <div id="pet-loading-progress-fill"></div>
            </div>
            <div id="pet-loading-percent" class="pet-loading-percent">0%</div>
        </div>
    </div>

    <!-- =====================================================
         CLEAN HUD CONTAINER (game.js will inject ui.js here)
    ====================================================== -->
    <div id="game-hud"></div>


        <!-- =================================================
             COINS
        ================================================== -->

        <div id="coin-display">

            🪙
            <span id="ui-coins">
                0
            </span>

        </div>


        <!-- =================================================
             CROSSHAIR
        ================================================== -->

        <div id="crosshair"></div>


        <!-- =================================================
             TOP MENU
        ================================================== -->

        <div id="top-menu">


            <button
                id="inventory-button"
                class="hud-button"
                type="button"
                title="Inventory"
                aria-label="Inventory"
            >
                🎒
            </button>


            <button
                id="map-button"
                class="hud-button"
                type="button"
                title="World Map"
                aria-label="World Map"
            >
                🗺️
            </button>


            <button
                id="settings-button"
                class="hud-button"
                type="button"
                title="Settings"
                aria-label="Settings"
            >
                ⚙️
            </button>


        </div>


        <!-- =================================================
             CONTROL HELP
        ================================================== -->

        <div id="control-hint">

            <strong>WASD</strong> Move
            &nbsp;•&nbsp;
            <strong>SHIFT</strong> Run
            &nbsp;•&nbsp;
            <strong>SPACE</strong> Jump
            <br>

            <strong>E</strong> Capture
            &nbsp;•&nbsp;
            <strong>F</strong> Eat
            &nbsp;•&nbsp;
            <strong>Mouse</strong> Attack

        </div>


    </div>


    <!-- =====================================================
         MOBILE CONTROLS
    ====================================================== -->

    <div id="mobile-ui">


        <div id="mobile-left">

            <div id="mobile-stick"></div>

        </div>


        <div id="mobile-right">


            <button
                id="mobile-jump"
                class="mobile-action"
                type="button"
                aria-label="Jump"
            >
                ⬆️
            </button>


            <button
                id="mobile-attack"
                class="mobile-action"
                type="button"
                aria-label="Attack"
            >
                ⚔️
            </button>


            <button
                id="mobile-capture"
                class="mobile-action small"
                type="button"
                aria-label="Capture"
            >
                🔵
            </button>


            <button
                id="mobile-eat"
                class="mobile-action small"
                type="button"
                aria-label="Eat"
            >
                🍖
            </button>


            <button
                id="mobile-run"
                class="mobile-action small"
                type="button"
                aria-label="Run"
            >
                🏃
            </button>


        </div>


    </div>


    <!-- =====================================================
         PAUSE SCREEN
    ====================================================== -->

    <div
        id="pause-overlay"
        class="hidden"
    >

        <div class="pause-box">

            <div class="pause-title">
                ⏸️ PAUSED
            </div>


            <button
                id="resume-button"
                class="pause-button"
                type="button"
            >
                ▶️ RESUME
            </button>


            <button
                id="pause-save-button"
                class="pause-button"
                type="button"
            >
                💾 SAVE GAME
            </button>


        </div>

    </div>


    <!-- =====================================================
         MAIN GAME ENTRY
         
         IMPORTANT:
         main.js must import Game from game.js
    ====================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>


    <!-- =====================================================
         PAGE INITIALIZATION
    ====================================================== -->

     <script>
        (() => {
            "use strict";

            const pauseOverlay = document.getElementById("pause-overlay");
            const resumeButton = document.getElementById("resume-button");
            const pauseSave = document.getElementById("pause-save-button");
            let paused = false;

            function setPause(state) {
                paused = Boolean(state);
                if (pauseOverlay) pauseOverlay.classList.toggle("hidden", !paused);
                if (window.petWorldGame) {
                    if (paused) window.petWorldGame.stop();
                    else window.petWorldGame.start();
                }
            }

            window.addEventListener("keydown", event => {
                if (event.code !== "Escape") return;
                if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA")) return;
                setPause(!paused);
            });

            if (resumeButton) {
                resumeButton.addEventListener("click", () => setPause(false));
            }

            if (pauseSave) {
                pauseSave.addEventListener("click", () => {
                    if (window.petWorldGame && window.petWorldGame.systems) {
                        window.petWorldGame.systems.saveGame();
                        if (window.petWorldGame.ui) window.petWorldGame.ui.notify("💾 Game saved");
                    }
                });
            }

            document.addEventListener("contextmenu", event => event.preventDefault());

            document.addEventListener("touchmove", event => {
                if (event.target.closest(".game-panel")) return;
                event.preventDefault();
            }, { passive: false });

            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            document.body.classList.add(isMobile ? "is-mobile" : "is-desktop");
        })();
    </script>


</body>
</html>
